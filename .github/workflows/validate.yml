name: Validate Charts

on:
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
      - "ct.yaml"

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: List changed charts
        id: changed
        shell: bash
        run: |
          charts="$(ct list-changed --config ct.yaml)"

          echo "Changed charts:"
          echo "${charts:-none}"

          if [[ -n "$charts" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed charts
        if: steps.changed.outputs.has_changes == 'true'
        run: ct lint --config ct.yaml

      - name: Template changed charts
        if: steps.changed.outputs.has_changes == 'true'
        shell: bash
        run: |
          while IFS= read -r chart; do
            [[ -z "$chart" ]] && continue

            echo "Rendering ${chart}"
            helm template test-release "$chart" > /dev/null
          done < <(ct list-changed --config ct.yaml)
