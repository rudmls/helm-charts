name: Publish Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"

concurrency:
  group: publish-charts
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Changed Charts
    runs-on: ubuntu-latest

    outputs:
      charts: ${{ steps.changes.outputs.charts }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: changes
        shell: bash
        run: |
          charts=$(
            git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" |
            grep '^charts/' |
            cut -d/ -f2 |
            sort -u |
            jq -R -s -c 'split("\n") | map(select(length > 0))'
          )

          echo "Changed charts: ${charts}"
          echo "charts=${charts}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.chart }}
    needs: detect

    if: needs.detect.outputs.charts != '[]'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build dependencies
        run: |
          helm dependency build \
            "charts/${{ matrix.chart }}"

      - name: Package chart
        run: |
          mkdir -p .packages

          helm package \
            "charts/${{ matrix.chart }}" \
            --destination .packages

      - name: Push chart
        run: |
          helm push \
            .packages/${{ matrix.chart }}-*.tgz \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
