{{- range .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
{{- with .labels }}
  labels:
{{ toYaml . | indent 4 }}
{{- end }}
{{- with .annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
data:
{{- range $key, $value := .data }}
  {{ $key }}: |
{{ $value | indent 4 }}
{{- end }}
{{- end }}
