{{- range .Values.networkPolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  {{- with .labels }}
  labels:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  podSelector:
{{ toYaml (.podSelector | default dict) | indent 4 }}

  {{- with .policyTypes }}
  policyTypes:
{{ toYaml . | indent 4 }}
  {{- end }}

  {{- with .ingress }}
  ingress:
{{ toYaml . | indent 4 }}
  {{- end }}

  {{- with .egress }}
  egress:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
