{{- range .Values.clusterIssuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  acme:
    email: {{ .acme.email | quote }}
    server: {{ .acme.server | quote }}
    privateKeySecretRef:
      name: {{ .acme.privateKeySecretName }}
    solvers:
{{ toYaml .acme.solvers | indent 6 }}
{{- end }}
